<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week4 Class Task</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="navbar">


            <div class="logo">

                <a><img src="logo.png" alt="Logo"></a>
            </div>
            <div class="nav-link">


                <a href="#">About</a>
                <a href="#">Skills</a>
                <a href="#">Website</a>

            </div>
        </div>
    </nav>
    <main class="container">

        <section>
            <div class="profile">


                <div class="name">

                    <h1>Marshal Ram</h1>
                </div>
                <div class="profile-picture">
                    <img src="profile.jpeg" alt="Profile Picture">
                </div>

                <div class="about">
                    <span class="about-me">
                        <h2>About Me</h2>

                    </span>
                    <span>

                        <p>I am a web developer with a passion for creating beautiful and functional websites.</p>
                    </span>

                </div>

                <div class="skills">
                    <span class="skills-title">

                        <h2>Skills</h2>
                    </span>
                    <span class="skills-list">

                        <ul>
                            <li>HTML</li>
                            <li>CSS</li>
                            <li>JavaScript</li>
                            <li>Python</li>
                        </ul>
                    </span>
                </div>

                <div class="website">
                    <span class="website-title">
                        <h2>Website</h2>
                    </span>
                    <span class="website-description">
                        <p>Check out my website for more information and projects.</p>
                    </span>
                    <span class="website-button"><a href="https://www.marshal.com.np">Visit My Website</a></span>
                </div>
                <div class="contact">
                    <span>
                        <button class="contact-button">Contact Me</button>
                    </span>
                </div>
        </section>
    </main>


</body>

</html>
